<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MBG Keuangan & Kasir SPPG</title>
    <meta name="description" content="Aplikasi PWA pencatatan keuangan dan pengeluaran operasional harian Satuan Pelayanan Pemenuhan Gizi (MBG) terintegrasi Google Sheets." />
    <meta property="og:title" content="MBG Keuangan & Kasir SPPG" />
    <meta property="og:description" content="Aplikasi PWA pencatatan keuangan dan pengeluaran operasional harian Satuan Pelayanan Pemenuhan Gizi (MBG) terintegrasi Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0D2319" />
    
    <!-- PWA iOS & Android Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MBG Kasir" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              pine: {
                50: '#f0f6f3',
                100: '#ddeee5',
                200: '#bfdecf',
                300: '#95c6b1',
                400: '#67a88f',
                500: '#468b72',
                600: '#34705b',
                700: '#2a5a4a',
                800: '#1a3e32',
                900: '#0d2319',
                950: '#06130d',
              },
              canvas: {
                bg: '#f6f8f6',
                card: '#ffffff',
                subtle: '#eef2ee',
                border: '#e2e8e2',
                borderDark: '#1a3e32',
              }
            },
            boxShadow: {
              'soft-xs': '0 1px 2px 0 rgba(13, 35, 25, 0.04)',
              'soft-sm': '0 2px 8px -1px rgba(13, 35, 25, 0.05), 0 1px 3px -1px rgba(13, 35, 25, 0.03)',
              'soft-md': '0 6px 18px -2px rgba(13, 35, 25, 0.06), 0 3px 8px -2px rgba(13, 35, 25, 0.04)',
              'soft-lg': '0 12px 28px -4px rgba(13, 35, 25, 0.08), 0 4px 12px -2px rgba(13, 35, 25, 0.03)',
              'floating': '0 12px 36px -4px rgba(13, 35, 25, 0.14), 0 4px 12px -2px rgba(13, 35, 25, 0.06)',
            }
          }
        }
      }
    </script>
    
    <!-- Global Style Resets & Mobile Ergonomics -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f6f8f6;
        color: #0d2319;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Subtle custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5cb;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9aa89a;
      }

      /* Clean Cashier Input Styling */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Safe Area bottom spacing for floating elements on modern devices */
      .safe-bottom-padding {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5rem);
      }
      .safe-floating-bottom {
        bottom: max(0.875rem, env(safe-area-inset-bottom, 0.875rem));
      }

      @media print {
        header, nav, #bottom-navigation, .no-print {
          display: none !important;
        }
        body {
          background-color: #ffffff !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#f6f8f6] text-[#0d2319] antialiased selection:bg-emerald-600 selection:text-white min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => { console.log('ServiceWorker registered with scope: ', reg.scope); },
            (err) => { console.log('ServiceWorker registration failed: ', err); }
          );
        });
      }
    </script>
  </body>
</html>
